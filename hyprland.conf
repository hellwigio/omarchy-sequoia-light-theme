# Omarchy 3.x — sourced from ~/.config/hypr/hyprland.conf
# Keep this file present even if you only use Omarchy 4 (avoids glob errors).

general {
    col.active_border = rgba(007AFFee)
    col.inactive_border = rgba(C7C7CCaa)
}

group {
    col.border_active = rgba(007AFFee)
    col.border_inactive = rgba(C7C7CCaa)
    col.border_locked_active = rgba(FF5F57ee)
}

misc {
    background_color = rgb(F5F5F7)
}
